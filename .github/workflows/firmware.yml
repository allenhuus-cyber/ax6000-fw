name: Build AX6000 Firmware

# 云端编译完整固件（本机无需 Docker/WSL）
#   手动运行：仓库 → Actions → Build AX6000 Firmware → Run workflow
#   打 tag 运行：git tag v1.0.0 && git push --tags（会自动附带 Release 附件）
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 分支或标签
        required: false
        default: main
      jobs:
        description: 并行编译任务数
        required: false
        default: "4"
      verbose:
        description: 日志级别（V=sc 精简 / V=s 全量）
        required: false
        default: "V=sc"
  push:
    tags: [ "v*" ]

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    env:
      JOBS: ${{ github.event.inputs.jobs || '4' }}
      VERBOSE: ${{ github.event.inputs.verbose || 'V=sc' }}
      OPENWRT_BRANCH: openwrt-24.10
      TARGET: mediatek/filogic
      PROFILE: xiaomi_redmi-router-ax6000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OpenWrt 编译需要 15GB+ 空间，先清掉 runner 预装的大件
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/share/swift /usr/share/powershell /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates xz-utils zstd subversion qemu-utils ccache \
            libelf-dev
      # 注：ubuntu-22.04 没有 java-properties-common / ecj / fastjar，已移除

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      # 缓存 OpenWrt 下载包与源码，二次编译可省 30 分钟+
      - name: Cache openwrt sources
        uses: actions/cache@v4
        with:
          path: |
            .build/openwrt/dl
            .build/openwrt/feeds
          key: openwrt-${{ env.OPENWRT_BRANCH }}-${{ env.PROFILE }}
          restore-keys: openwrt-

      - name: Build agent binary
        run: |
          chmod +x build/build.sh
          ./build/build.sh agent

      - name: Build firmware
        run: ./build/build.sh firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-firmware-${{ github.run_number }}
          path: dist/firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ragentd (单独安装用)
        uses: actions/upload-artifact@v4
        with:
          name: ragentd-arm64-${{ github.run_number }}
          path: dist/ragentd

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/firmware/*
